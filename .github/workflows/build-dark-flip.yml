          $bytes = [Convert]::FromBase64String(($b64 -replace '\s', ''))
          [IO.File]::WriteAllBytes("$PWD\dark-flip.patch", $bytes)
          $hash = (Get-FileHash dark-flip.patch -Algorithm SHA256).Hash
          if ($hash -ne $env:PATCH_SHA256) { throw "Embedded patch is damaged: SHA-256 $hash, expected $env:PATCH_SHA256" }
          git apply --ignore-whitespace --check dark-flip.patch
          if ($LASTEXITCODE -ne 0) { throw "The Dark Flip patch does not apply to $env:UPSTREAM_REF." }
          git apply --ignore-whitespace dark-flip.patch
          if ($LASTEXITCODE -ne 0) { throw "git apply failed." }
          Remove-Item dark-flip.patch
          git status --short

      # The Spotify helper (Spotify Connect, a Rust library) is left out: DINGOSDK_CARGO=OFF stops
      # CMake from finding the runner's cargo, so ReSkate.dll is built without it, as on a machine
      # with no Rust. Spotify then plays through its own app; nothing else changes.
      - name: Configure
        shell: pwsh
        working-directory: ReSkate
        run: |
          cmake --preset vs2022-x64 "-DDINGOSDK_VERSION=${{ inputs.reskate_version }}" -DDINGOSDK_CARGO=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

      - name: Build
        shell: pwsh
        working-directory: ReSkate
        run: |
          cmake --build --preset release --parallel 4 --target dingosdk_launcher dingosdk_runtime
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      - name: Pack ReSkate.dll + ReSkateLauncher.exe
        id: pack
        shell: pwsh
        run: |
          $out = "ReSkate/build/vs2022-x64/Release"
          $files = @("ReSkate.dll", "ReSkateLauncher.exe")
          New-Item -ItemType Directory -Force -Path package | Out-Null
          foreach ($f in $files) {
            $path = Join-Path $out $f
            if (-not (Test-Path $path)) {
              $found = Get-ChildItem -Path ReSkate/build -Recurse -Filter $f | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
              if (-not $found) { throw "$f was not built." }
              $path = $found.FullName
            }
            Copy-Item $path package/
          }
          $name = "ReSkate_DarkFlip-$env:DARK_FLIP_VERSION-ReSkate${{ inputs.reskate_version }}"
          Compress-Archive -Path package/* -DestinationPath "$name.zip" -Force
          Get-ChildItem package | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name }
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: package/*
          if-no-files-found: error

      - name: Publish a release
        if: ${{ inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:DARK_FLIP_VERSION"
          $notes = "Dark Flip $env:DARK_FLIP_VERSION (first fix) on ReSkate ${{ inputs.reskate_version }}. Replace ReSkate.dll and ReSkateLauncher.exe in your ReSkate folder with these."
          gh release create $tag "${{ steps.pack.outputs.name }}.zip" --repo "${{ github.repository }}" --title "Dark Flip $env:DARK_FLIP_VERSION" --notes $notes
