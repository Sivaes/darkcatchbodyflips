# Dark Flip: builds ReSkate (Dingo-Shenanigans/ReSkate) with the Dark Flip patch applied and packs
# just the two files people copy over their ReSkate folder: ReSkate.dll and ReSkateLauncher.exe.
# The patch is embedded below, so this one file is the whole repo's build.
#
# Dark Flip 0.2.0 on ReSkate 2.1.2: the FIRST FIX ("darkflip on|off", on by default).
#   In a dark catch the game refuses a new grab press, so no body flip can start. Dark Flip sets the
#   grab intent itself while LT / RT is held with the stick, as the heelflip glitch does, and the game's
#   own body flip runs, without the grab pose. ReSkate.log gets a line per dark air ("Dark Flip: air ...").
#   The probe below is still in.
#   Body flips out of a dark catch: skate. starts a body flip only once a grab (LT / RT) has
#   registered, and a dark catch refuses the grab press. The probe records every air so the refusal
#   can be found (console "darkflip status | probe on|off | mark <text> | names"):
#     logs\dark-flip-steps-*.csv   a row per physics step: pad, physics state, board and skeleton
#                                  up axes and spins (dark or not), the context flags, the trick state
#     logs\dark-flip-states-*.csv  every animation game state of the skater that changed, by name
#     logs\dark-flip-names-*.txt   the state names found in the game's memory (only on "darkflip names";
#                                  0.1.1 no longer searches on its own, and searches gently)
#     ReSkate.log                  a line per air
#   The Spotify helper is left out of the build (as in Grab Fix).
name: Build Dark Flip

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ReSkate tag to build on
        default: v2.1.2
        required: true
      reskate_version:
        description: Version stamped into the binaries (the ReSkate release it is built on)
        default: 2.1.2
        required: true
      release:
        description: Also publish a GitHub release with the zip
        type: boolean
        default: false

permissions:
  contents: write

env:
  DARK_FLIP_VERSION: 0.2.0
  PATCH_SHA256: C483810E7343861230CAC04FB3E19458EDEAABEB514CD0B2258F345373FCB865

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Get ReSkate ${{ inputs.upstream_ref }}
        uses: actions/checkout@v4
        with:
          repository: Dingo-Shenanigans/ReSkate
          ref: ${{ inputs.upstream_ref }}
          path: ReSkate

      # No GitHub expression (dollar sign + double braces) may appear in this step's run block: GitHub would evaluate the whole
      # block (the embedded patch) as one expression, which is capped at 21000 characters.
